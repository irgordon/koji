name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_release:
    name: Build release artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Validate backend
        run: go test ./...

      - name: Test frontend
        working-directory: web
        run: npm run test

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Build release
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: make release

      - name: Verify release artifacts
        run: make verify-release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koji-release-linux-amd64
          path: |
            build/release/kojid-linux-amd64
            build/release/koji-agent-linux-amd64
            build/release/koji-rootfs-linux-amd64.tar.gz
            build/release/SHA256SUMS.txt
          if-no-files-found: error

  smoke_test_release:
    name: Smoke-test release artifacts
    runs-on: ubuntu-24.04
    needs: build_release
    outputs:
      checksums_valid: ${{ steps.smoke.outputs.checksums_valid }}
      rootfs_layout_valid: ${{ steps.smoke.outputs.rootfs_layout_valid }}
      systemd_units_valid: ${{ steps.smoke.outputs.systemd_units_valid }}
      forbidden_paths_found: ${{ steps.smoke.outputs.forbidden_paths_found }}

    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: koji-release-linux-amd64
          path: build/release

      - name: Run release smoke tests
        id: smoke
        run: packaging/scripts/ci_verify_release_outputs.sh build/release

  publish_release:
    name: Publish release assets
    runs-on: ubuntu-24.04
    needs: smoke_test_release

    steps:
      - name: Download checked artifacts
        uses: actions/download-artifact@v4
        with:
          name: koji-release-linux-amd64
          path: build/release

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/kojid-linux-amd64
            build/release/koji-agent-linux-amd64
            build/release/koji-rootfs-linux-amd64.tar.gz
            build/release/SHA256SUMS.txt
